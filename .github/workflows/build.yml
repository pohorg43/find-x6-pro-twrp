name: TWRP Build CI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fast dry-run validation (no full AOSP sync/build)"
        required: true
        type: boolean
        default: true
      build_jobs:
        description: "Parallel build jobs (0 = auto nproc)"
        required: false
        default: "0"

jobs:
  twrp-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout meta-repository
        uses: actions/checkout@v4

      - name: Load specifications
        run: |
          source ci/twrp-spec.env
          echo "REF_TREE_SM8550=$REF_TREE_SM8550" >> "$GITHUB_ENV"
          echo "REF_TREE_SM8550_SHA=$REF_TREE_SM8550_SHA" >> "$GITHUB_ENV"
          echo "REF_MANIFEST_A16=$REF_MANIFEST_A16" >> "$GITHUB_ENV"
          echo "REF_MANIFEST_BRANCH=$REF_MANIFEST_BRANCH" >> "$GITHUB_ENV"
          echo "DEVICE_CODENAME=$DEVICE_CODENAME" >> "$GITHUB_ENV"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "BOARD_NAME=$BOARD_NAME" >> "$GITHUB_ENV"

      # ==========================================
      # FAST DRY RUN (dry_run == true)
      # ==========================================
      - name: Dry Run - Setup Device Tree
        if: ${{ inputs.dry_run }}
        run: |
          echo "=== Block devices (lsblk) ==="
          lsblk || true
          echo "=== Mounted filesystems (df -h) ==="
          df -h || true
          echo "=== Setting up device tree at SHA $REF_TREE_SM8550_SHA ==="
          git clone "$REF_TREE_SM8550" device/oplus/sm8550
          git -C device/oplus/sm8550 checkout "$REF_TREE_SM8550_SHA"

      - name: Dry Run - Apply Overlay and Patches
        if: ${{ inputs.dry_run }}
        run: |
          bash scripts/ci/apply-overlay.sh device/oplus/sm8550

      - name: Dry Run - Validate Device Tree and Manifest
        if: ${{ inputs.dry_run }}
        run: |
          bash scripts/ci/validate-device.sh device/oplus/sm8550

      - name: Dry Run - Summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "=================================================="
          echo "DRY RUN PASSED: Device tree is valid for PGEM10!"
          echo "- Target: OPPO Find X6 Pro ($DEVICE_CODENAME / $PLATFORM)"
          echo "- Base Tree SHA: $REF_TREE_SM8550_SHA"
          echo "- Patches applied cleanly: 0 *.rej files"
          echo "- Battery + SMCInvoke + Synaptics TCM2 minimal module chain (45 .ko) verified"
          echo "- Step D VINTF (hwservicemanager + boot@1.2 + health@2.1 + gatekeeper@1.0 + qseecom@1.0 + KeyMint V2 AIDL), Boot HAL 1.2 libs, clear-bcb + override-spl PID loop, twrp.flags (A/B + backup-only EFS), no my_colorospro, TW_NO_FLASH_CURRENT_TWRP, and ELF closure verified"
          echo "- Clean header config: PLATFORM_VERSION=13 / PLATFORM_SECURITY_PATCH=2025-11-01"
          echo "- Remote manifest reachable: $REF_MANIFEST_A16 ($REF_MANIFEST_BRANCH)"
          echo "=================================================="

      # ==========================================
      # FULL BUILD (dry_run == false)
      # ==========================================
      - name: Full Build - Native Disk Cleanup & Swap
        if: ${{ !inputs.dry_run }}
        run: |
          bash scripts/ci/disk-cleanup.sh

      - name: Full Build - Setup Host Environment
        if: ${{ !inputs.dry_run }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends repo git-lfs lz4 libncurses6 bc bison flex libssl-dev ccache
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore ccache
        if: ${{ !inputs.dry_run }}
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: twrp16-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            twrp16-ccache-${{ github.ref_name }}-

      - name: Restore target toolchains cache (Clang & Rust)
        if: ${{ !inputs.dry_run }}
        id: restore-toolchains
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/twrp_src/prebuilts/clang/host/linux-x86
            /home/runner/twrp_src/prebuilts/rust
          key: twrp16-toolchains-r547379-r530567-rust1.83.0

      - name: Full Build - Sync TWRP Manifest
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p /home/runner/twrp_src
          cd /home/runner/twrp_src
          echo "=== Disk space before repo init & sync ==="
          df -h /
          echo "=== Initializing repo manifest ==="
          repo init -u "$REF_MANIFEST_A16" -b "$REF_MANIFEST_BRANCH" --depth=1 --groups=default,-mips,-darwin,-notdefault
          echo "=== Installing local prune manifest ==="
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/manifests/remove-unneeded.xml" .repo/local_manifests/
          echo "=== Syncing source ==="
          (while true; do sleep 60; echo "=== Sync progress $(date) ==="; df -h /; done) &
          SYNC_LOG_PID=$!
          repo sync --current-branch --no-clone-bundle --no-tags --optimized-fetch --force-sync -j$(nproc)
          kill $SYNC_LOG_PID 2>/dev/null || true
          echo "=== Sync complete. Freeing disk space: removing .repo ==="
          rm -rf .repo
          echo "=== Disk space after removing .repo ==="
          df -h /

          if [ -f "prebuilts/clang/host/linux-x86/clang-r547379/bin/clang" ] && [ -f "prebuilts/clang/host/linux-x86/clang-r530567/lib/libclang.so" ] && [ -d "prebuilts/rust/linux-x86/1.83.0" ]; then
            echo "=== Target toolchains restored from cache, skipping sparse clone ==="
          else
            echo "=== Cache miss or incomplete toolchains. Sparse-cloning target Clang (clang-r547379 + clang-r530567) ==="
            rm -rf prebuilts/clang/host/linux-x86 prebuilts/rust
            git clone --depth=1 --branch android-16.0.0_r1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 prebuilts/clang/host/linux-x86
            git -C prebuilts/clang/host/linux-x86 sparse-checkout set clang-r547379 clang-r530567 clang-stable llvm-binutils-stable soong profiles
            rm -rf prebuilts/clang/host/linux-x86/.git

            echo "=== Sparse-cloning target Rust (1.83.0 / linux-x86) at tag android-16.0.0_r1 ==="
            git clone --depth=1 --branch android-16.0.0_r1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/rust prebuilts/rust
            git -C prebuilts/rust sparse-checkout set linux-x86/1.83.0 linux-x86/stable soong
            rm -rf prebuilts/rust/.git
          fi

          echo "=== Disk space after toolchain setup ==="
          df -h /

      - name: Save target toolchains cache (Clang & Rust)
        if: ${{ !inputs.dry_run && steps.restore-toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/twrp_src/prebuilts/clang/host/linux-x86
            /home/runner/twrp_src/prebuilts/rust
          key: twrp16-toolchains-r547379-r530567-rust1.83.0

      - name: Full Build - Setup Device Tree & Overlay
        if: ${{ !inputs.dry_run }}
        run: |
          cd /home/runner/twrp_src
          git clone "$REF_TREE_SM8550" device/oplus/sm8550
          git -C device/oplus/sm8550 checkout "$REF_TREE_SM8550_SHA"
          bash "$GITHUB_WORKSPACE/scripts/ci/apply-overlay.sh" device/oplus/sm8550
          bash "$GITHUB_WORKSPACE/scripts/ci/validate-device.sh" device/oplus/sm8550

      - name: Full Build - Compile Recovery Image
        if: ${{ !inputs.dry_run }}
        run: |
          echo "=== Tuning kernel swap aggressiveness ==="
          sudo sysctl -w vm.swappiness=10

          echo "=== Granting OOM-killer immunity to GitHub Actions Runner ==="
          for pid in $(pgrep -f "Runner\.(Listener|Worker)"); do
            echo -1000 | sudo tee /proc/$pid/oom_score_adj >/dev/null || true
          done

          cd /home/runner/twrp_src
          echo "=== Memory & Disk status before compilation ==="
          free -h
          df -h /

          echo "=== Top 20 space consumers in twrp_src ==="
          du -xh --max-depth=2 /home/runner/twrp_src | sort -hr | head -n 20

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=$(command -v ccache)
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPRESS=1
          export SOONG_GOMEMLIMIT=13GiB
          export GOMEMLIMIT=13GiB
          export GOGC=30

          ccache -M "$CCACHE_MAXSIZE" || true
          echo "=== ccache stats before build ==="
          ccache -s || true

          echo "=== Patching build/blueprint/bootstrap/bootstrap.go to pass GOGC=30 and GOMEMLIMIT=13GiB through env -i ==="
          cp build/blueprint/bootstrap/bootstrap.go /tmp/bootstrap.go.orig
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("build/blueprint/bootstrap/bootstrap.go")
          src = p.read_text()
          target = '`env -i $env "$$BUILDER" ` +'
          replacement = '`env -i GOGC=30 GOMEMLIMIT=13GiB $env "$$BUILDER" ` +'
          assert src.count(target) == 1, f"Unexpected match count: {src.count(target)}"
          p.write_text(src.replace(target, replacement, 1))
          PYEOF
          diff -u /tmp/bootstrap.go.orig build/blueprint/bootstrap/bootstrap.go || [ $? -eq 1 ]
          rm -f /tmp/bootstrap.go.orig

          echo "=== Patching bootable/recovery/etc/init/keystore2.rc to disable early start and critical window=0 ==="
          cp bootable/recovery/etc/init/keystore2.rc /tmp/keystore2.rc.orig
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("bootable/recovery/etc/init/keystore2.rc")
          src = p.read_text()
          early_target = "on late-init\n    start keystore2"
          early_repl = "# Disabled early late-init start; launched after KeyMint in init.recovery.qcom.rc"
          crit_target = "    critical window=0"
          crit_repl = "    disabled\n    # critical window=0 disabled for TWRP"
          assert src.count(early_target) == 1, f"Unexpected early_target count: {src.count(early_target)}"
          assert src.count(crit_target) == 1, f"Unexpected crit_target count: {src.count(crit_target)}"
          p.write_text(src.replace(early_target, early_repl, 1).replace(crit_target, crit_repl, 1))
          PYEOF
          diff -u /tmp/keystore2.rc.orig bootable/recovery/etc/init/keystore2.rc || [ $? -eq 1 ]
          rm -f /tmp/keystore2.rc.orig

          echo "=== Applying Step D patches to vendor/twrp and bootable/recovery ==="
          python3 - <<'PYEOF'
          from pathlib import Path
          import subprocess, tempfile

          def patch_file(path_str, replacements):
              p = Path(path_str)
              orig = p.read_text()
              backup = Path(tempfile.gettempdir()) / (p.name + ".orig")
              backup.write_text(orig)
              src = orig
              for label, target, repl in replacements:
                  cnt = src.count(target)
                  assert cnt == 1, f"{path_str} [{label}]: expected 1 match, found {cnt}"
                  src = src.replace(target, repl, 1)
              p.write_text(src)
              subprocess.run(["diff", "-u", str(backup), path_str], check=False)
              backup.unlink(missing_ok=True)

          # 1. Propagate TW_NO_FLASH_CURRENT_TWRP through BoardConfigSoong.mk & bootable/recovery/twrp_flags.go
          patch_file("vendor/twrp/config/BoardConfigSoong.mk", [
              (
                  "export TW_NO_FLASH_CURRENT_TWRP",
                  "    AB_OTA_UPDATER \\\n",
                  "    AB_OTA_UPDATER \\\n    TW_NO_FLASH_CURRENT_TWRP \\\n",
              ),
          ])
          patch_file("bootable/recovery/twrp_flags.go", [
              (
                  "TW_NO_FLASH_CURRENT_TWRP",
                  "\tif makeBoolValue(getVar(\"AB_OTA_UPDATER\")) {\n\t\tflags = append(flags, \"-DAB_OTA_UPDATER=1\")\n\t}\n",
                  "\tif makeBoolValue(getVar(\"AB_OTA_UPDATER\")) {\n\t\tflags = append(flags, \"-DAB_OTA_UPDATER=1\")\n\t}\n\tif makeBoolValue(getVar(\"TW_NO_FLASH_CURRENT_TWRP\")) {\n\t\tflags = append(flags, \"-DTW_NO_FLASH_CURRENT_TWRP\")\n\t}\n",
              ),
          ])

          # 2. Hide unsafe tools for PGEM10 in twrp_tools_backend.cpp (keep TW_HAS_DATA_MEDIA intact)
          patch_file("bootable/recovery/gui2/backend/twrp_tools_backend.cpp", [
              (
                  "hide disable_avb2/fix_contexts/install_kernel",
                  "  result.disable_avb2 = true;\n  result.fix_contexts = flag(TW_HAS_DATA_MEDIA);\n  const bool repack = flag(\"tw_has_boot_slots\") && flag(\"tw_has_repack_tools\");\n  result.install_ramdisk = repack && flag(\"tw_include_install_recovery_ramdisk\");\n  result.reflash_twrp =\n      repack && !flag(\"tw_no_flash_current_twrp\") && !flag(\"tw_is_vendor_boot_header_v3\");\n  result.install_kernel = repack;\n",
                  "  result.disable_avb2 = false;\n  result.fix_contexts = false;\n  const bool repack = flag(\"tw_has_boot_slots\") && flag(\"tw_has_repack_tools\");\n  result.install_ramdisk = repack && flag(\"tw_include_install_recovery_ramdisk\");\n  result.reflash_twrp =\n      repack && !flag(\"tw_no_flash_current_twrp\") && !flag(\"tw_is_vendor_boot_header_v3\");\n  result.install_kernel = false;\n",
              ),
          ])

          # 3. Hide orphan tw_auto_disable_avb2 checkbox and fix Backup/Restore Options tab scroll in gui2.cpp
          patch_file("bootable/recovery/gui2/gui2.cpp", [
              (
                  "gate tw_auto_disable_avb2",
                  "  add(nullptr, text.general_disable_avb2, \"tw_auto_disable_avb2\");\n",
                  "  if (tools != nullptr && tools->availability().disable_avb2)\n    add(nullptr, text.general_disable_avb2, \"tw_auto_disable_avb2\");\n",
              ),
              (
                  "backup_option_event_cb scroll settle+clamp",
                  "  else if (*target == kBackupEncryptTarget) {\n    page_state.backup_encrypt = checked;\n    gui2_pages::show_backup_password(page_state.backup_view, checked);\n  }\n",
                  "  else if (*target == kBackupEncryptTarget) {\n    const int scroll_y = main_content == nullptr ? 0 : lv_obj_get_scroll_y(main_content);\n    page_state.backup_encrypt = checked;\n    gui2_pages::show_backup_password(page_state.backup_view, checked);\n    if (main_content != nullptr) lv_obj_scroll_to_y(main_content, 0, LV_ANIM_OFF);\n    page_host.settle();\n    if (main_content != nullptr && lv_obj_has_flag(main_content, LV_OBJ_FLAG_SCROLLABLE)) {\n      const int max_scroll = std::max(0, static_cast<int>(lv_obj_get_scroll_bottom(main_content)));\n      lv_obj_scroll_to_y(main_content, std::clamp(scroll_y, 0, max_scroll), LV_ANIM_OFF);\n    }\n  }\n",
              ),
              (
                  "backup_tab_changed scroll reset + settle",
                  "static void backup_tab_changed(size_t index, void*) {\n  page_state.backup_active_tab = index;\n  gui2_pages::show_backup_tab(page_state.backup_view, index);\n  if (hardware != nullptr) hardware->vibrate(gui2_backend::haptic_channel::BUTTON);\n}\n",
                  "static void backup_tab_changed(size_t index, void*) {\n  page_state.backup_active_tab = index;\n  gui2_pages::show_backup_tab(page_state.backup_view, index);\n  if (main_content != nullptr) lv_obj_scroll_to_y(main_content, 0, LV_ANIM_OFF);\n  page_host.settle();\n  if (hardware != nullptr) hardware->vibrate(gui2_backend::haptic_channel::BUTTON);\n}\n",
              ),
              (
                  "restore_tab_changed scroll reset + settle",
                  "static void restore_tab_changed(size_t index, void*) {\n  page_state.restore_active_tab = index;\n  gui2_pages::show_restore_tab(page_state.restore_view, index);\n  if (hardware != nullptr) hardware->vibrate(gui2_backend::haptic_channel::BUTTON);\n}\n",
                  "static void restore_tab_changed(size_t index, void*) {\n  page_state.restore_active_tab = index;\n  gui2_pages::show_restore_tab(page_state.restore_view, index);\n  if (main_content != nullptr) lv_obj_scroll_to_y(main_content, 0, LV_ANIM_OFF);\n  page_host.settle();\n  if (hardware != nullptr) hardware->vibrate(gui2_backend::haptic_channel::BUTTON);\n}\n",
              ),
          ])

          # 4. Restrict single-line textareas to horizontal scrolling so vertical swipe scrolls page
          patch_file("bootable/recovery/gui2/pages/backup_page.cpp", [
              (
                  "backup_page input LV_DIR_HOR",
                  "  lv_obj_t* input = lv_textarea_create(parent);\n  lv_textarea_set_one_line(input, true);\n",
                  "  lv_obj_t* input = lv_textarea_create(parent);\n  lv_textarea_set_one_line(input, true);\n  lv_obj_set_scroll_dir(input, LV_DIR_HOR);\n",
              ),
          ])
          patch_file("bootable/recovery/gui2/pages/restore_page.cpp", [
              (
                  "restore_page input LV_DIR_HOR",
                  "    view.password_input = lv_textarea_create(view.options_pane);\n    lv_textarea_set_one_line(view.password_input, true);\n",
                  "    view.password_input = lv_textarea_create(view.options_pane);\n    lv_textarea_set_one_line(view.password_input, true);\n    lv_obj_set_scroll_dir(view.password_input, LV_DIR_HOR);\n",
              ),
          ])

          # 5. Suppress 4 Hz AIDL health fallback spam in battery_utils.cpp (log once, keep HIDL polling intact)
          patch_file("bootable/recovery/recovery_utils/battery_utils.cpp", [
              (
                  "log AIDL health fallback once",
                  "  if (health == nullptr) {\n    LOG(INFO) << \"Unable to get AIDL health service, trying HIDL...\";\n",
                  "  if (health == nullptr) {\n    static bool logged_aidl_unavailable = false;\n    if (!logged_aidl_unavailable) {\n      LOG(INFO) << \"Unable to get AIDL health service, trying HIDL...\";\n      logged_aidl_unavailable = true;\n    }\n",
              ),
          ])
          PYEOF

          lunch twrp_sm8550-aosp_current-eng

          JOBS="${{ inputs.build_jobs }}"
          if [ "$JOBS" = "0" ] || [ -z "$JOBS" ]; then
            JOBS=$(nproc --all)
          fi
          echo "Building recoveryimage with -j$JOBS (nice -n 19 ionice -c 3 m)..."
          (while true; do echo "=== Build progress $(date) ==="; free -h; df -h / | tail -1; ps -eo pid,comm,%mem,rss --sort=-rss | head -n 6; sleep 60; done) &
          BUILD_LOG_PID=$!
          nice -n 19 ionice -c 3 m -j"$JOBS" recoveryimage
          kill $BUILD_LOG_PID 2>/dev/null || true

          echo "=== ccache stats after build ==="
          ccache -s || true

      - name: Save ccache
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: twrp16-ccache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Full Build - Verify Built Image
        if: ${{ !inputs.dry_run }}
        run: |
          cd /home/runner/twrp_src
          echo "=== Disk space after compilation ==="
          df -h /
          bash "$GITHUB_WORKSPACE/scripts/ci/validate-device.sh" device/oplus/sm8550 --ramdisk-root out/target/product/sm8550/recovery/root
          bash "$GITHUB_WORKSPACE/scripts/ci/verify-image.sh" out/target/product/sm8550/recovery.img

      - name: Full Build - Upload Artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pgem10-recovery
          path: /home/runner/twrp_src/out/target/product/sm8550/recovery.img
          if-no-files-found: error

      - name: Full Build - Upload Build Logs
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: twrp-build-logs-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /home/runner/twrp_src/out/error.log
            /home/runner/twrp_src/out/verbose.log.gz
            /home/runner/twrp_src/out/soong.log
            /home/runner/twrp_src/out/build.log
